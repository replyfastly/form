<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carla Agent - Secretária virtual inteligente para profissionais">
    <title>Carla Agent — Questionário</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css">
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;
        const { createRoot } = ReactDOM;

        const CheckCircle2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );
        const Circle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" strokeWidth={2} />
            </svg>
        );
        const ChevronRight = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
            </svg>
        );
        const ChevronLeft = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" />
            </svg>
        );
        const BotIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 3.75h4.5M12 3.75V6m0 0a7.5 7.5 0 110 15A7.5 7.5 0 0112 6zm-3 7.5h.008v.008H9V13.5zm6 0h.008v.008H15V13.5zM9.75 16.5s.75 1.5 2.25 1.5 2.25-1.5 2.25-1.5" />
            </svg>
        );

        function CarlaAgentSurvey() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [showContactCapture, setShowContactCapture] = useState(false);
            const [contactCaptured, setContactCaptured] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitted, setSubmitted] = useState(false);
            const [contactInfo, setContactInfo] = useState({ name: '', whatsapp: '+55' });

            const CARLA_WHATSAPP = '5582999299818';
            const GOOGLE_SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbxwitYA_Szrhaa-WGsLD0ZxqrHCW8TARoqDa5ylY_IKhSWKipF6UjsawKW_kV07YhK-/exec';

            // Captura de contato aparece após esta pergunta (0-based)
            const CONTACT_AFTER_INDEX = 1;

            const questions = [
                {
                    id: 'q1',
                    question: 'Como você gerencia as conversas com clientes hoje?',
                    subtitle: 'Queremos entender sua rotina atual.',
                    type: 'single',
                    options: [
                        { id: 'a', text: 'Respondo tudo eu mesma, no meu tempo', value: 'self_manage' },
                        { id: 'b', text: 'Tenho alguém que me ajuda', value: 'has_help' },
                        { id: 'c', text: 'Uso alguma ferramenta ou app', value: 'uses_tool' },
                        { id: 'd', text: 'Outro', value: 'other', hasInput: true }
                    ]
                },
                {
                    id: 'q2',
                    question: 'Qual é o maior problema em atender clientes pelo WhatsApp?',
                    subtitle: 'Escolha o que mais te incomoda no dia a dia.',
                    type: 'single',
                    options: [
                        { id: 'a', text: 'Demoro para responder e perco clientes', value: 'slow_response' },
                        { id: 'b', text: 'Interrompe meu trabalho e minha vida pessoal', value: 'interruptions' },
                        { id: 'c', text: 'Difícil agendar sem conflito de horários', value: 'scheduling' },
                        { id: 'd', text: 'Clientes perguntam sempre as mesmas coisas', value: 'repetitive' },
                        { id: 'e', text: 'Outro', value: 'other', hasInput: true }
                    ]
                },
                {
                    id: 'q3',
                    question: 'Quanto você estima que perde por não responder rápido?',
                    subtitle: 'Pense em clientes que foram embora por falta de retorno.',
                    type: 'single',
                    options: [
                        { id: 'a', text: 'Pouco — quase não perco clientes assim', value: 'low_loss' },
                        { id: 'b', text: 'Às vezes — sinto que perco alguns', value: 'medium_loss' },
                        { id: 'c', text: 'Bastante — resposta rápida faria diferença real', value: 'high_loss' },
                        { id: 'd', text: 'Muito — é um problema sério no meu negócio', value: 'critical_loss' }
                    ]
                },
                {
                    id: 'q4',
                    question: 'Você já tentou resolver isso de alguma forma?',
                    subtitle: 'Sem julgamento — é só para entender o que já foi testado.',
                    type: 'single',
                    options: [
                        { id: 'a', text: 'Não, ainda não tentei nada', value: 'never_tried' },
                        { id: 'b', text: 'Tentei mas não funcionou bem', value: 'tried_failed', hasInput: true, inputLabel: 'O que tentou?' },
                        { id: 'c', text: 'Uso algo hoje, mas não é ideal', value: 'using_imperfect', hasInput: true, inputLabel: 'O que usa hoje?' },
                        { id: 'd', text: 'Pago alguém para me ajudar', value: 'pays_help', hasInput: true, inputLabel: 'Quanto por mês? (R$)', inputType: 'number' }
                    ]
                },
                {
                    id: 'q5',
                    question: 'O que seria indispensável numa assistente virtual para o seu negócio?',
                    subtitle: 'Selecione tudo que for importante para você.',
                    type: 'multiple',
                    options: [
                        { id: 'a', text: 'Responder perguntas básicas automaticamente', value: 'auto_reply' },
                        { id: 'b', text: 'Agendar horários sem conflito', value: 'scheduling' },
                        { id: 'c', text: 'Parecer que sou EU respondendo, no meu estilo', value: 'personalization' },
                        { id: 'd', text: 'Coletar informações do cliente antes do atendimento', value: 'client_info' },
                        { id: 'e', text: 'Nunca expor meus dados pessoais', value: 'privacy' },
                        { id: 'f', text: 'Funcionar 24h, mesmo quando estou dormindo', value: 'always_on' },
                        { id: 'g', text: 'Outro', value: 'other', hasInput: true }
                    ]
                },
                {
                    id: 'q6',
                    question: 'Você toparia testar gratuitamente por 7 dias e me dar um feedback honesto?',
                    subtitle: 'Sem contrato, sem cartão de crédito. Só para ver se faz sentido pra você.',
                    type: 'single',
                    options: [
                        { id: 'a', text: 'Sim! Me avise quando estiver pronto', value: 'yes_notify' },
                        { id: 'b', text: 'Sim, mas precisa ser simples de usar', value: 'yes_easy' },
                        { id: 'c', text: 'Talvez — depende de como funciona', value: 'maybe' },
                        { id: 'd', text: 'Não tenho interesse agora', value: 'no_interest' }
                    ]
                }
            ];

            const calculateScore = (answersData) => {
                let score = 0;
                const q3 = answersData.q3?.option;
                const q4 = answersData.q4?.option;
                const q6 = answersData.q6?.option;
                if (q3 === 'c' || q3 === 'd') score++;
                if (q4 === 'b' || q4 === 'c') score++;
                if (q4 === 'd') score += 2;
                if (q6 === 'a' || q6 === 'b') score++;
                return Math.min(score, 4);
            };

            const getQuality = (score) => {
                if (score >= 4) return 'HOT_LEAD';
                if (score === 3) return 'WARM_LEAD';
                if (score === 2) return 'COLD_LEAD';
                return 'LOW_INTEREST';
            };

            const sendToGoogleSheets = async (answersData, contact) => {
                try {
                    const score = calculateScore(answersData);
                    const q5selected = answersData.q5?.options
                        ? Object.keys(answersData.q5.options).filter(k => answersData.q5.options[k]).join(', ')
                        : '';
                    const data = {
                        Nome: contact.name,
                        WhatsApp: contact.whatsapp,
                        Score: score,
                        Quality: getQuality(score),
                        Q1: answersData.q1?.option || '',
                        Q1_custom: answersData.q1?.custom || '',
                        Q2: answersData.q2?.option || '',
                        Q2_custom: answersData.q2?.custom || '',
                        Q3: answersData.q3?.option || '',
                        Q4: answersData.q4?.option || '',
                        Q4_custom: answersData.q4?.custom || '',
                        Q5: q5selected,
                        Q6: answersData.q6?.option || ''
                    };
                    await fetch(GOOGLE_SHEETS_WEBHOOK, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    return true;
                } catch (e) {
                    console.error('Erro Google Sheets:', e);
                    return false;
                }
            };

            const formatWhatsAppMessage = () => {
                const score = calculateScore(answers);
                const quality = getQuality(score);
                let msg = `🤖 *CARLA AGENT — Nova Resposta*\n\n`;
                msg += `👤 *${contactInfo.name}*\n`;
                msg += `📱 ${contactInfo.whatsapp}\n`;
                msg += `⭐ Score: ${score}/4 — ${quality}\n`;
                msg += `📅 ${new Date().toLocaleString('pt-BR')}\n\n`;
                msg += `---\n\n`;
                questions.forEach((q, idx) => {
                    const ans = answers[q.id];
                    if (!ans) return;
                    msg += `*${idx + 1}. ${q.question}*\n`;
                    if (q.type === 'single') {
                        const opt = q.options.find(o => o.id === ans.option);
                        msg += `→ ${opt?.text || 'N/A'}\n`;
                        if (ans.custom) msg += `  Detalhe: ${ans.custom}\n`;
                    } else {
                        const selected = Object.keys(ans.options || {}).filter(k => ans.options[k]);
                        selected.forEach(k => {
                            const opt = q.options.find(o => o.id === k);
                            msg += `✓ ${opt?.text || k}\n`;
                        });
                    }
                    msg += '\n';
                });
                return encodeURIComponent(msg);
            };

            const handleSubmit = async () => {
                setIsSubmitting(true);
                await sendToGoogleSheets(answers, contactInfo);
                setTimeout(() => {
                    setSubmitted(true);
                    setIsSubmitting(false);
                    setTimeout(() => {
                        window.open(`https://wa.me/${CARLA_WHATSAPP}?text=${formatWhatsAppMessage()}`, '_blank');
                    }, 300);
                }, 800);
            };

            const handleAnswer = (questionId, optionId, customValue) => {
                const question = questions.find(q => q.id === questionId);
                if (question.type === 'single') {
                    setAnswers({
                        ...answers,
                        [questionId]: {
                            option: optionId,
                            custom: customValue !== undefined ? customValue : answers[questionId]?.custom
                        }
                    });
                } else {
                    const current = answers[questionId] || { options: {}, customs: {} };
                    if (customValue === undefined) {
                        setAnswers({
                            ...answers,
                            [questionId]: {
                                options: { ...current.options, [optionId]: !current.options[optionId] },
                                customs: current.customs
                            }
                        });
                    } else {
                        setAnswers({
                            ...answers,
                            [questionId]: {
                                options: current.options,
                                customs: { ...current.customs, [optionId]: customValue }
                            }
                        });
                    }
                }
            };

            const isAnswered = (qId) => {
                const ans = answers[qId];
                if (!ans) return false;
                const q = questions.find(q => q.id === qId);
                if (q.type === 'single') return !!ans.option;
                return Object.values(ans.options || {}).some(v => v);
            };

            const canGoNext = () => isAnswered(questions[currentQuestion].id);
            const canSubmitContact = () => contactInfo.name.trim().length > 2 && contactInfo.whatsapp.length > 8;

            const goNext = () => {
                if (currentQuestion === CONTACT_AFTER_INDEX && !contactCaptured) {
                    setShowContactCapture(true);
                    return;
                }
                if (currentQuestion < questions.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setShowResults(true);
                }
            };

            const handleContactSubmit = () => {
                setContactCaptured(true);
                setShowContactCapture(false);
                setCurrentQuestion(currentQuestion + 1);
            };

            // Header reutilizável
            const Header = ({ current, total }) => (
                <div className="mb-6">
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-2">
                            <BotIcon className="w-8 h-8 text-indigo-400" />
                            <div>
                                <h2 className="text-2xl font-bold text-white">Carla Agent</h2>
                                <p className="text-xs text-slate-400">Secretária virtual inteligente</p>
                            </div>
                        </div>
                        {current !== undefined && (
                            <span className="text-slate-400 text-sm">{current} de {total}</span>
                        )}
                    </div>
                    {current !== undefined && (
                        <div className="w-full bg-slate-700 rounded-full h-2">
                            <div
                                className="bg-gradient-to-r from-indigo-500 to-purple-500 h-2 rounded-full transition-all duration-300"
                                style={{ width: `${(current / total) * 100}%` }}
                            />
                        </div>
                    )}
                </div>
            );

            // Tela de captura de contato intermediária
            if (showContactCapture) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-6 flex items-center justify-center">
                        <div className="max-w-3xl w-full bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-8 shadow-2xl">
                            <Header current={currentQuestion + 1} total={questions.length} />

                            <div className="mb-8">
                                <div className="bg-indigo-500/10 border border-indigo-500/30 rounded-lg p-4 mb-6">
                                    <p className="text-indigo-300 text-sm leading-relaxed">
                                        <span className="text-white font-semibold">Suas respostas fazem muito sentido!</span> Antes de continuar, deixa eu guardar seu contato para te avisar quando o teste estiver disponível.
                                    </p>
                                </div>

                                <h3 className="text-2xl font-semibold text-white mb-6">Como posso te chamar?</h3>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-slate-400 text-sm mb-1">Seu nome *</label>
                                        <input
                                            type="text"
                                            placeholder="Ex: Mariana"
                                            value={contactInfo.name}
                                            onChange={(e) => setContactInfo({ ...contactInfo, name: e.target.value })}
                                            className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-400 text-sm mb-1">WhatsApp (com DDD) *</label>
                                        <input
                                            type="tel"
                                            placeholder="+55 82 99999-9999"
                                            value={contactInfo.whatsapp}
                                            onChange={(e) => setContactInfo({ ...contactInfo, whatsapp: e.target.value })}
                                            className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                                        />
                                        <p className="text-slate-500 text-xs mt-1">Não enviamos spam. Só entraremos em contato sobre o teste da Carla.</p>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-3">
                                <button
                                    onClick={() => setShowContactCapture(false)}
                                    className="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 px-6 rounded-lg font-medium transition-all flex items-center justify-center gap-2"
                                >
                                    <ChevronLeft className="w-5 h-5" />
                                    Voltar
                                </button>
                                <button
                                    onClick={handleContactSubmit}
                                    disabled={!canSubmitContact()}
                                    className={`flex-1 py-3 px-6 rounded-lg font-medium transition-all flex items-center justify-center gap-2 ${
                                        canSubmitContact()
                                            ? 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white'
                                            : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                                    }`}
                                >
                                    Continuar
                                    <ChevronRight className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Tela de resultados
            if (showResults) {
                const score = calculateScore(answers);
                const quality = getQuality(score);
                const wantsToTest = answers.q6?.option === 'a' || answers.q6?.option === 'b';

                const scoreMessages = {
                    4: '🔥 Você é exatamente o perfil que a Carla Agent foi criada para ajudar. Vamos conversar!',
                    3: '✅ Você tem dores reais que a Carla consegue resolver. Temos muito a conversar.',
                    2: '💡 Há potencial aqui. Quero te mostrar como a Carla pode encaixar no seu dia a dia.',
                    1: '📊 Obrigada pelo feedback honesto. Ele vai nos ajudar a melhorar.',
                    0: '📊 Obrigada pelo feedback honesto. Ele vai nos ajudar a melhorar.'
                };

                if (submitted) {
                    return (
                        <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-6 flex items-center justify-center">
                            <div className="max-w-2xl w-full bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-8 shadow-2xl text-center">
                                <div className="text-6xl mb-4">🎉</div>
                                <h2 className="text-2xl font-bold text-white mb-3">Recebido, {contactInfo.name}!</h2>
                                <p className="text-slate-300 mb-6">
                                    {wantsToTest
                                        ? 'Entro em contato em até 24h para agendar seu teste gratuito de 7 dias.'
                                        : 'Obrigada pelo seu tempo e feedback honesto!'}
                                </p>
                                <button
                                    onClick={() => window.open(`https://wa.me/${CARLA_WHATSAPP}?text=${formatWhatsAppMessage()}`, '_blank')}
                                    className="w-full py-3 px-6 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-all"
                                >
                                    📱 Abrir WhatsApp novamente
                                </button>
                                <p className="text-slate-500 text-xs mt-3">Caso o WhatsApp não tenha aberto automaticamente</p>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-6 flex items-center justify-center">
                        <div className="max-w-2xl w-full bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-8 shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="flex items-center justify-center gap-2 mb-2">
                                    <BotIcon className="w-10 h-10 text-indigo-400" />
                                    <h1 className="text-3xl font-bold text-white">Carla Agent</h1>
                                </div>
                                <p className="text-slate-400 text-sm">Secretária virtual inteligente</p>
                            </div>

                            <div className="bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border border-indigo-500/30 rounded-lg p-6 mb-6">
                                <h3 className="text-lg font-semibold text-white mb-3">Seu perfil</h3>
                                <div className="flex gap-2 mb-3">
                                    {[1, 2, 3, 4].map(i => (
                                        <div key={i} className={`h-2.5 flex-1 rounded-full ${i <= score ? 'bg-indigo-400' : 'bg-slate-600'}`} />
                                    ))}
                                </div>
                                <p className="text-slate-200 text-sm leading-relaxed">{scoreMessages[score]}</p>
                            </div>

                            {wantsToTest && (
                                <div className="bg-slate-700/30 border border-slate-600/50 rounded-lg p-4 mb-6">
                                    <p className="text-slate-300 text-sm leading-relaxed">
                                        <span className="text-white font-medium">Próximo passo:</span> Clique em "Enviar respostas" e eu entro em contato para agendar o seu teste gratuito de 7 dias. Sem compromisso, sem cartão.
                                    </p>
                                </div>
                            )}

                            <div className="space-y-3">
                                <button
                                    onClick={handleSubmit}
                                    disabled={isSubmitting}
                                    className={`w-full py-4 px-6 rounded-lg font-bold text-lg transition-all flex items-center justify-center gap-2 shadow-lg ${
                                        isSubmitting
                                            ? 'bg-slate-700 text-slate-500 cursor-not-allowed'
                                            : 'bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white'
                                    }`}
                                >
                                    {isSubmitting ? '⏳ Enviando...' : '📱 Enviar minhas respostas'}
                                </button>
                                <p className="text-center text-slate-400 text-sm">
                                    Suas respostas são enviadas de forma organizada e entro em contato em até 24h.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }

            // Tela principal de perguntas
            const currentQ = questions[currentQuestion];
            const currentAnswer = answers[currentQ.id];

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 p-6 flex items-center justify-center">
                    <div className="max-w-3xl w-full">
                        <div className="bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-8 shadow-2xl">
                            <Header current={currentQuestion + 1} total={questions.length} />

                            <div className="mb-8">
                                <h3 className="text-2xl font-semibold text-white mb-2">{currentQ.question}</h3>
                                {currentQ.subtitle && (
                                    <p className="text-slate-400 text-sm mb-5">{currentQ.subtitle}</p>
                                )}
                                {currentQ.type === 'multiple' && (
                                    <p className="text-indigo-300 text-xs mb-4">Selecione quantas quiser</p>
                                )}

                                <div className="space-y-3">
                                    {currentQ.options.map((option) => {
                                        const isSelected = currentQ.type === 'single'
                                            ? currentAnswer?.option === option.id
                                            : currentAnswer?.options?.[option.id];

                                        return (
                                            <div key={option.id}>
                                                <button
                                                    onClick={() => handleAnswer(currentQ.id, option.id)}
                                                    className={`w-full text-left p-4 rounded-lg transition-all flex items-start gap-3 ${
                                                        isSelected
                                                            ? 'bg-indigo-500/30 border-2 border-indigo-400'
                                                            : 'bg-slate-700/30 border-2 border-slate-600 hover:border-slate-500'
                                                    }`}
                                                >
                                                    {currentQ.type === 'single' ? (
                                                        isSelected
                                                            ? <CheckCircle2 className="w-6 h-6 text-indigo-400 flex-shrink-0 mt-0.5" />
                                                            : <Circle className="w-6 h-6 text-slate-500 flex-shrink-0 mt-0.5" />
                                                    ) : (
                                                        <div className={`w-6 h-6 rounded border-2 flex items-center justify-center flex-shrink-0 mt-0.5 ${
                                                            isSelected ? 'bg-indigo-500 border-indigo-400' : 'border-slate-500'
                                                        }`}>
                                                            {isSelected && <CheckCircle2 className="w-4 h-4 text-white" />}
                                                        </div>
                                                    )}
                                                    <span className={isSelected ? 'text-white font-medium' : 'text-slate-300'}>
                                                        {option.text}
                                                    </span>
                                                </button>

                                                {option.hasInput && isSelected && (
                                                    <input
                                                        type={option.inputType || 'text'}
                                                        placeholder={option.inputLabel || 'Especifique...'}
                                                        value={currentQ.type === 'single' ? (currentAnswer?.custom || '') : (currentAnswer?.customs?.[option.id] || '')}
                                                        onChange={(e) => {
                                                            e.stopPropagation();
                                                            handleAnswer(currentQ.id, option.id, e.target.value);
                                                        }}
                                                        onClick={(e) => e.stopPropagation()}
                                                        className="mt-2 ml-9 w-[calc(100%-2.25rem)] bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                                                    />
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="flex gap-3">
                                {currentQuestion > 0 && (
                                    <button
                                        onClick={() => setCurrentQuestion(currentQuestion - 1)}
                                        className="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-3 px-6 rounded-lg font-medium transition-all flex items-center justify-center gap-2"
                                    >
                                        <ChevronLeft className="w-5 h-5" />
                                        Voltar
                                    </button>
                                )}
                                <button
                                    onClick={goNext}
                                    disabled={!canGoNext()}
                                    className={`flex-1 py-3 px-6 rounded-lg font-medium transition-all flex items-center justify-center gap-2 ${
                                        canGoNext()
                                            ? 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white'
                                            : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                                    }`}
                                >
                                    {currentQuestion === questions.length - 1 ? 'Ver resultado' : 'Próxima'}
                                    <ChevronRight className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        <div className="text-center mt-6 text-sm text-slate-500">
                            <p>🔒 Seus dados estão seguros conosco</p>
                            <p className="mt-1">
                                Dúvidas? <a href="https://wa.me/5582999299818" className="text-indigo-400 hover:underline">+55 82 99929-9818</a>
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<CarlaAgentSurvey />);
    </script>
</body>
</html>
